<svg width="150" height="150" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="40" stroke="#38bdf8" stroke-width="4" fill="none"
    stroke-dasharray="62.8 188.4">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 50 50" 
      to="360 50 50" 
      dur="1.5s" 
      repeatCount="indefinite"/>
  </circle>

  <circle cx="50" cy="50" r="30" stroke="#22c55e" stroke-width="4" fill="none"
    stroke-dasharray="47.1 141.3">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="360 50 50" 
      to="0 50 50" 
      dur="1s" 
      repeatCount="indefinite"/>
  </circle>
</svg>
